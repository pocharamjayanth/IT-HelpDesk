<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpDesk AI — Enterprise IT Service Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-900 font-sans antialiased overflow-hidden">

  <div id="app" class="h-full flex flex-col"></div>

  <script>
    // Configurable Dynamic API Endpoint Resolution
    const API_URL = window.ENV_API_URL || 
                    (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                     ? 'http://127.0.0.1:8000/api' 
                     : 'https://it-helpdesk-backend.onrender.com/api');

    const STATE = {
      currentView: 'dashboard', // Options: 'dashboard', 'queue', 'kb'
      currentUser: { name: 'Jayanth P.', role: 'Employee', workspace: 'Workspace #402', avatar: 'JP' },
      tickets: [],
      isLoading: false,
      errorMessage: null
    };

    async function fetchTickets() {
      STATE.isLoading = true;
      STATE.errorMessage = null;
      render();
      try {
        const res = await fetch(`${API_URL}/tickets`);
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
        STATE.tickets = await res.json();
      } catch (err) {
        console.error('API Error:', err);
        STATE.errorMessage = 'Failed to connect to FastAPI server at ' + API_URL;
      } finally {
        STATE.isLoading = false;
        render();
      }
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="h-full bg-slate-50 flex text-slate-900 overflow-hidden">
          ${renderSidebar()}
          <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            ${renderTopbar()}
            <main class="flex-1 overflow-y-auto p-8 custom-scrollbar">
              ${STATE.errorMessage ? `
                <div class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs flex items-center justify-between">
                  <span><i class="fa-solid fa-triangle-exclamation mr-2"></i>${STATE.errorMessage}</span>
                  <button onclick="fetchTickets()" class="px-3 py-1 bg-red-600 text-white rounded-lg text-xs font-semibold">Retry Connection</button>
                </div>
              ` : ''}
              ${renderMainContent()}
            </main>
          </div>
        </div>
        ${renderCreateTicketModal()}
      `;
    }

    function renderSidebar() {
      return `
        <aside class="w-64 bg-slate-900 text-slate-300 flex-shrink-0 flex flex-col justify-between border-r border-slate-800 hidden md:flex">
          <div>
            <div class="p-6 border-b border-slate-800/80 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
                  <i class="fa-solid fa-headset"></i>
                </div>
                <div>
                  <span class="font-bold text-white text-base leading-none block">HelpDesk <span class="text-blue-500">AI</span></span>
                  <span class="text-[10px] text-slate-400">Enterprise IT Hub</span>
                </div>
              </div>
              <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30">AI-Powered</span>
            </div>

            <nav class="p-4 space-y-1 text-xs font-medium">
              <a href="javascript:void(0)" onclick="navigate('dashboard')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg ${STATE.currentView === 'dashboard' ? 'text-white bg-blue-600 font-semibold shadow-sm' : 'hover:bg-slate-800 hover:text-white'}">
                <i class="fa-solid fa-chart-pie w-4"></i> Overview / Home
              </a>
              <a href="javascript:void(0)" onclick="navigate('queue')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg ${STATE.currentView === 'queue' ? 'text-white bg-blue-600 font-semibold shadow-sm' : 'hover:bg-slate-800 hover:text-white'}">
                <i class="fa-solid fa-list-check w-4"></i> IT Ticket Queue
              </a>
              <a href="javascript:void(0)" onclick="openModal()" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">
                <i class="fa-solid fa-circle-plus w-4"></i> Create Ticket
              </a>
              <a href="javascript:void(0)" onclick="navigate('kb')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg ${STATE.currentView === 'kb' ? 'text-white bg-blue-600 font-semibold shadow-sm' : 'hover:bg-slate-800 hover:text-white'}">
                <i class="fa-solid fa-book-open w-4"></i> Knowledge Base
              </a>
            </nav>
          </div>

          <div class="p-4 border-t border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold text-white text-xs">${STATE.currentUser.avatar}</div>
              <div>
                <span class="block text-xs font-semibold text-white">${STATE.currentUser.name}</span>
                <span class="block text-[11px] text-slate-400">${STATE.currentUser.role}</span>
              </div>
            </div>
            <button class="text-slate-400 hover:text-white"><i class="fa-solid fa-gear text-xs"></i></button>
          </div>
        </aside>
      `;
    }

    function renderTopbar() {
      return `
        <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between sticky top-0 z-20">
          <div class="relative w-96">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400 text-xs"></i>
            <input type="text" placeholder="Search tickets, articles, or keywords (Ctrl+K)..." class="w-full pl-9 pr-4 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
          </div>
          <div class="flex items-center gap-4">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Operational: Tier-1 Live
            </span>
            <span class="px-2.5 py-1 rounded-md text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200">Role: ${STATE.currentUser.role}</span>
            <button onclick="openModal()" class="px-4 py-2 text-xs font-semibold rounded-lg bg-blue-600 hover:bg-blue-700 text-white flex items-center gap-2 shadow-sm shadow-blue-600/30">
              <i class="fa-solid fa-plus"></i> Create Ticket
            </button>
          </div>
        </header>
      `;
    }

    function renderMainContent() {
      if (STATE.isLoading) {
        return `<div class="p-12 text-center text-slate-500 font-medium"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p>Loading database tickets...</p></div>`;
      }
      if (STATE.currentView === 'queue') return renderQueue();
      if (STATE.currentView === 'kb') return renderKnowledgeBase();
      return renderDashboard();
    }

    function renderDashboard() {
      const total = STATE.tickets.length;
      const open = STATE.tickets.filter(t => t.status === 'open').length;
      const inProgress = STATE.tickets.filter(t => t.status === 'in_progress').length;
      const resolved = STATE.tickets.filter(t => t.status === 'resolved').length;

      return `
        <div class="max-w-7xl w-full mx-auto space-y-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <h1 class="text-2xl font-bold text-slate-900">Good morning, ${STATE.currentUser.name} 👋</h1>
                <span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-200 text-slate-700">Engineering • ${STATE.currentUser.workspace}</span>
              </div>
              <p class="text-xs text-slate-500">Here's what's happening with your IT tickets and connected workspace services today.</p>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="navigate('kb')" class="px-3.5 py-2 text-xs font-medium rounded-lg border border-slate-200 hover:bg-white bg-slate-50 text-slate-700 flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-book-open text-blue-600"></i> Self-Service Guides
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Tickets</span>
                <span class="text-3xl font-extrabold text-slate-900 block mt-1">${total}</span>
                <span class="text-[11px] text-slate-400">All database requests</span>
              </div>
              <div class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600"><i class="fa-solid fa-ticket text-lg"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Open</span>
                <span class="text-3xl font-extrabold text-rose-600 block mt-1">${open}</span>
                <span class="text-[11px] text-slate-400">Awaiting triage</span>
              </div>
              <div class="w-10 h-10 rounded-lg bg-rose-50 flex items-center justify-center text-rose-600"><i class="fa-solid fa-circle-exclamation text-lg"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">In Progress</span>
                <span class="text-3xl font-extrabold text-blue-600 block mt-1">${inProgress}</span>
                <span class="text-[11px] text-slate-400">Active engineers assigned</span>
              </div>
              <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600"><i class="fa-solid fa-spinner text-lg"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Resolved</span>
                <span class="text-3xl font-extrabold text-emerald-600 block mt-1">${resolved}</span>
                <span class="text-[11px] text-slate-400">Closed this cycle</span>
              </div>
              <div class="w-10 h-10 rounded-lg bg-emerald-50 flex items-center justify-center text-emerald-600"><i class="fa-solid fa-circle-check text-lg"></i></div>
            </div>
          </div>

          <div class="p-4 rounded-xl bg-gradient-to-r from-blue-50 via-indigo-50/40 to-white border border-blue-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-lg bg-blue-600 text-white flex items-center justify-center shadow-sm"><i class="fa-solid fa-bolt"></i></div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold text-slate-900">AI Health Check: Network incident detected on Floor 4</span>
                  <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-rose-100 text-rose-700">High Impact</span>
                </div>
                <p class="text-xs text-slate-600 mt-0.5">Automated router diagnostics in progress. Estimated resolution: 18 minutes.</p>
              </div>
            </div>
            <button class="px-3 py-1.5 rounded-lg bg-white border border-blue-300 text-xs font-semibold text-blue-700 hover:bg-blue-50">View Live Telemetry</button>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-8 bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden flex flex-col">
              <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <div>
                  <h2 class="text-sm font-bold text-slate-900">Recent Tickets</h2>
                  <p class="text-xs text-slate-500">Real-time status synced with Supabase PostgreSQL</p>
                </div>
                <button onclick="fetchTickets()" class="text-xs font-semibold text-blue-600 hover:underline"><i class="fa-solid fa-rotate mr-1"></i>Refresh</button>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr class="bg-slate-50/80 text-slate-500 font-semibold border-b border-slate-200">
                      <th class="p-3 pl-5">TICKET ID</th>
                      <th class="p-3">TITLE</th>
                      <th class="p-3">CATEGORY</th>
                      <th class="p-3">PRIORITY</th>
                      <th class="p-3">STATUS</th>
                      <th class="p-3 pr-5">ASSIGNEE</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${STATE.tickets.length === 0 ? '<tr><td colspan="6" class="p-6 text-center text-slate-400">No tickets found in database.</td></tr>' : 
                      STATE.tickets.map(t => `
                      <tr class="hover:bg-slate-50/70 transition">
                        <td class="p-3 pl-5 font-bold text-blue-600">${t.ticket_number || t.id}</td>
                        <td class="p-3 font-medium text-slate-900">${t.title}</td>
                        <td class="p-3 text-slate-600"><span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-100">${t.category}</span></td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-semibold ${t.priority === 'critical' \vert{}\vert{} t.priority === 'high' ? 'bg-rose-50 text-rose-700' : 'bg-amber-50 text-amber-700'} uppercase">${t.priority}</span></td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${t.status === 'resolved' ? 'bg-emerald-50 text-emerald-700' : 'bg-sky-50 text-sky-700'}">${t.status}</span></td>
                        <td class="p-3 pr-5 text-slate-500">${t.assignee_name || 'Unassigned'}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="lg:col-span-4 space-y-6">
              <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-xs font-bold text-slate-900 flex items-center gap-1.5"><i class="fa-solid fa-book-open text-blue-600"></i> Instant Self-Help</h3>
                  <span class="text-[10px] font-semibold text-slate-400 uppercase">KB Guides</span>
                </div>
                <p class="text-xs text-slate-500 mb-4">Resolve common issues in under 3 minutes.</p>
                <div class="space-y-2">
                  <a href="javascript:void(0)" onclick="navigate('kb')" class="flex items-center justify-between p-2.5 rounded-lg border border-slate-100 hover:border-blue-200 hover:bg-blue-50/30 transition text-xs group">
                    <div>
                      <span class="font-semibold text-slate-800 block group-hover:text-blue-600">Connect to Corp Wi-Fi (802.1X)</span>
                      <span class="text-[11px] text-slate-400">3 min read • Network</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-400 group-hover:text-blue-600"></i>
                  </a>
                  <a href="javascript:void(0)" onclick="navigate('kb')" class="flex items-center justify-between p-2.5 rounded-lg border border-slate-100 hover:border-blue-200 hover:bg-blue-50/30 transition text-xs group">
                    <div>
                      <span class="font-semibold text-slate-800 block group-hover:text-blue-600">VPN Certificate Troubleshooting</span>
                      <span class="text-[11px] text-slate-400">5 min read • Security</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-400 group-hover:text-blue-600"></i>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderQueue() {
      const unassigned = STATE.tickets.filter(t => !t.assignee_name || t.assignee_name === 'Unassigned');
      return `
        <div class="max-w-7xl w-full mx-auto space-y-6">
          <div class="flex justify-between items-center">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">IT Support Ticket Queue</h1>
              <p class="text-xs text-slate-500">Manage agent assignments, SLAs, and status transitions.</p>
            </div>
            <span class="px-3 py-1 bg-blue-100 text-blue-700 font-semibold rounded-full text-xs">
              ${unassigned.length} Unassigned
            </span>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-50 text-slate-500 uppercase font-semibold border-b border-slate-200">
                    <th class="p-4">Ticket ID</th>
                    <th class="p-4">Title</th>
                    <th class="p-4">Priority</th>
                    <th class="p-4">Status Control</th>
                    <th class="p-4">Assignee</th>
                    <th class="p-4">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${STATE.tickets.map(t => `
                    <tr class="hover:bg-slate-50 transition">
                      <td class="p-4 font-bold text-blue-600">${t.ticket_number || t.id}</td>
                      <td class="p-4 font-medium">${t.title}</td>
                      <td class="p-4"><span class="${t.priority === 'critical' ? 'text-rose-600' : 'text-amber-600'} font-semibold uppercase">${t.priority}</span></td>
                      <td class="p-4">
                        <select onchange="updateTicketStatus('${t.id}', this.value)" class="bg-slate-50 border border-slate-200 rounded px-2 py-1 font-semibold">
                          <option value="open" ${t.status === 'open' ? 'selected' : ''}>Open</option>
                          <option value="in_progress" ${t.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                          <option value="resolved" ${t.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                        </select>
                      </td>
                      <td class="p-4 text-slate-600">${t.assignee_name || 'Unassigned'}</td>
                      <td class="p-4">
                        <button onclick="assignTicketToMe('${t.id}')" class="px-3 py-1 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded text-xs font-semibold">
                          Assign to Me
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderKnowledgeBase() {
      return `
        <div class="max-w-5xl w-full mx-auto space-y-6">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Knowledge Base & Self-Service</h1>
            <p class="text-xs text-slate-500">Step-by-step procedures verified by Enterprise IT.</p>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="p-5 bg-white border border-slate-200 rounded-xl shadow-sm space-y-2">
              <h3 class="font-bold text-sm text-slate-900">Connect to Corp Wi-Fi (802.1X)</h3>
              <p class="text-xs text-slate-600">Select 'Corp-Secure' network and authenticate using your Okta SSO credentials and hardware YubiKey.</p>
            </div>
            <div class="p-5 bg-white border border-slate-200 rounded-xl shadow-sm space-y-2">
              <h3 class="font-bold text-sm text-slate-900">VPN Certificate Flushing</h3>
              <p class="text-xs text-slate-600">If GlobalProtect rejects connection on macOS Sonoma, run <code>sudo dscacheutil -flushcache</code> in Terminal.</p>
            </div>
          </div>
        </div>
      `;
    }

    function renderCreateTicketModal() {
      return `
        <div id="ticketModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
          <div class="bg-white rounded-2xl w-full max-w-2xl border border-slate-200 shadow-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
              <div>
                <span class="text-[10px] font-bold text-blue-600 uppercase tracking-wider">Direct Intake</span>
                <h3 class="font-bold text-base text-slate-900">Create New Ticket</h3>
              </div>
              <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleCreateTicket(event)" class="p-6 space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ticket Title / Subject *</label>
                <div class="relative">
                  <input type="text" id="modalTitle" required placeholder="e.g. Cannot connect to enterprise VPN after update" class="w-full px-4 py-2 rounded-lg border border-slate-200 text-xs focus:ring-2 focus:ring-blue-600 focus:outline-none pr-10">
                  <button type="button" onclick="runAITriage()" class="absolute right-2 top-1.5 px-2 py-0.5 rounded text-[10px] font-bold bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100">⚡ AI Triage</button>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Category *</label>
                  <select id="modalCategory" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-xs bg-white">
                    <option value="network">Network & Connectivity</option>
                    <option value="hardware">Hardware & Devices</option>
                    <option value="software">Software & Applications</option>
                    <option value="account_access">Identity & SSO Access</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Priority Level *</label>
                  <select id="modalPriority" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-xs bg-white">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Detailed Description *</label>
                <textarea id="modalDesc" rows="4" required placeholder="Describe symptoms or paste error logs..." class="w-full p-3 rounded-lg border border-slate-200 text-xs font-mono focus:ring-2 focus:ring-blue-600 focus:outline-none"></textarea>
              </div>
              <div class="pt-2 border-t border-slate-100 flex justify-between items-center">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700">Cancel</button>
                <button type="submit" id="submitBtn" class="px-5 py-2 rounded-lg text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-md shadow-blue-600/30">Submit Ticket</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function navigate(view) { STATE.currentView = view; render(); }
    function openModal() { document.getElementById('ticketModal').classList.replace('hidden', 'flex'); }
    function closeModal() { document.getElementById('ticketModal').classList.replace('flex', 'hidden'); }

    async function updateTicketStatus(ticketId, newStatus) {
      try {
        const res = await fetch(`${API_URL}/tickets/${ticketId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        if (res.ok) fetchTickets();
      } catch (err) { alert('Failed to update ticket status.'); }
    }

    async function assignTicketToMe(ticketId) {
      try {
        const res = await fetch(`${API_URL}/tickets/${ticketId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ assignee_name: STATE.currentUser.name, status: 'in_progress' })
        });
        if (res.ok) fetchTickets();
      } catch (err) { alert('Failed to assign ticket.'); }
    }

    async function runAITriage() {
      const title = document.getElementById('modalTitle').value;
      const desc = document.getElementById('modalDesc').value;
      if (!title && !desc) return alert('Enter title and description first.');

      try {
        const res = await fetch(`${API_URL}/triage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description: desc })
        });
        const data = await res.json();
        if (data.suggested_category) document.getElementById('modalCategory').value = data.suggested_category;
        if (data.suggested_priority) document.getElementById('modalPriority').value = data.suggested_priority;
        alert(`⚡ AI Triage Recommendation:\n\nCategory: ${data.suggested_category.toUpperCase()}\nPriority: ${data.suggested_priority.toUpperCase()}\nConfidence: ${(data.confidence_score * 100).toFixed(0)}%\n\nReasoning: ${data.reasoning}`);
      } catch (err) { alert('Could not reach AI Triage endpoint on ' + API_URL); }
    }

    async function handleCreateTicket(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'Saving...';

      const payload = {
        title: document.getElementById('modalTitle').value,
        description: document.getElementById('modalDesc').value,
        category: document.getElementById('modalCategory').value,
        priority: document.getElementById('modalPriority').value
      };

      try {
        const res = await fetch(`${API_URL}/tickets`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Failed to create ticket');
        closeModal();
        fetchTickets();
      } catch (err) { alert('Failed to insert ticket into database.'); } 
      finally {
        btn.disabled = false;
        btn.innerText = 'Submit Ticket';
      }
    }

    window.onload = fetchTickets;
  </script>
</body>
</html>
