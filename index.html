<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpDesk AI — Enterprise IT Service Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-900 font-sans antialiased overflow-hidden">

  <div id="app" class="h-full flex flex-col"></div>

  <script>
    const API_URL = window.ENV_API_URL || 
                    (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                     ? 'http://127.0.0.1:8000/api' 
                     : 'https://it-helpdesk-backend.onrender.com/api');

    const STATE = {
      currentView: 'dashboard',
      currentUser: { name: 'Jayanth P.', role: 'Agent', workspace: 'Workspace #402', avatar: 'JP' },
      authToken: 'demo-bearer-token',
      tickets: [],
      isLoading: false,
      errorMessage: null
    };

    async function fetchTickets() {
      STATE.isLoading = true;
      STATE.errorMessage = null;
      render();
      try {
        const res = await fetch(`${API_URL}/tickets`);
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
        STATE.tickets = await res.json();
      } catch (err) {
        console.error('API Error:', err);
        STATE.errorMessage = 'Could not connect to FastAPI backend at ' + API_URL;
      } finally {
        STATE.isLoading = false;
        render();
      }
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="h-full bg-slate-50 flex text-slate-900 overflow-hidden">
          ${renderSidebar()}
          <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            ${renderTopbar()}
            <main class="flex-1 overflow-y-auto p-8 custom-scrollbar">
              ${STATE.errorMessage ? `
                <div class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs flex items-center justify-between">
                  <span><i class="fa-solid fa-triangle-exclamation mr-2"></i>${STATE.errorMessage}</span>
                  <button onclick="fetchTickets()" class="px-3 py-1 bg-red-600 text-white rounded-lg text-xs font-semibold">Retry</button>
                </div>
              ` : ''}
              ${renderMainContent()}
            </main>
          </div>
        </div>
        ${renderCreateTicketModal()}
      `;
    }

    function renderSidebar() {
      return `
        <aside class="w-64 bg-slate-900 text-slate-300 flex-shrink-0 flex flex-col justify-between border-r border-slate-800 hidden md:flex">
          <div>
            <div class="p-6 border-b border-slate-800/80 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
                  <i class="fa-solid fa-headset"></i>
                </div>
                <div>
                  <span class="font-bold text-white text-base leading-none block">HelpDesk <span class="text-blue-500">AI</span></span>
                  <span class="text-[10px] text-slate-400">Enterprise IT Hub</span>
                </div>
              </div>
              <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30">AI-Powered</span>
            </div>

            <nav class="p-4 space-y-1 text-xs font-medium">
              <a href="javascript:void(0)" onclick="navigate('dashboard')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg ${STATE.currentView === 'dashboard' ? 'text-white bg-blue-600 font-semibold' : 'hover:bg-slate-800 hover:text-white'}">
                <i class="fa-solid fa-chart-pie w-4"></i> Overview / Home
              </a>
              <a href="javascript:void(0)" onclick="navigate('queue')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg ${STATE.currentView === 'queue' ? 'text-white bg-blue-600 font-semibold' : 'hover:bg-slate-800 hover:text-white'}">
                <i class="fa-solid fa-list-check w-4"></i> IT Ticket Queue
              </a>
              <a href="javascript:void(0)" onclick="openModal()" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">
                <i class="fa-solid fa-circle-plus w-4"></i> Create Ticket
              </a>
            </nav>
          </div>

          <div class="p-4 border-t border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold text-white text-xs">${STATE.currentUser.avatar}</div>
              <div>
                <span class="block text-xs font-semibold text-white">${STATE.currentUser.name}</span>
                <span class="block text-[11px] text-slate-400">${STATE.currentUser.role}</span>
              </div>
            </div>
          </div>
        </aside>
      `;
    }

    function renderTopbar() {
      return `
        <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between sticky top-0 z-20">
          <div class="relative w-96">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400 text-xs"></i>
            <input type="text" placeholder="Search tickets or keywords..." class="w-full pl-9 pr-4 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
          </div>
          <div class="flex items-center gap-4">
            <button onclick="openModal()" class="px-4 py-2 text-xs font-semibold rounded-lg bg-blue-600 hover:bg-blue-700 text-white flex items-center gap-2 shadow-sm">
              <i class="fa-solid fa-plus"></i> Create Ticket
            </button>
          </div>
        </header>
      `;
    }

    function renderMainContent() {
      if (STATE.isLoading) {
        return `<div class="p-12 text-center text-slate-500 font-medium"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p>Loading database tickets...</p></div>`;
      }
      return STATE.currentView === 'queue' ? renderQueue() : renderDashboard();
    }

    function renderDashboard() {
      const total = STATE.tickets.length;
      const open = STATE.tickets.filter(t => t.status === 'open').length;
      const inProgress = STATE.tickets.filter(t => t.status === 'in_progress').length;
      const resolved = STATE.tickets.filter(t => t.status === 'resolved').length;

      return `
        <div class="max-w-7xl w-full mx-auto space-y-6">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Good morning, ${STATE.currentUser.name} 👋</h1>
            <p class="text-xs text-slate-500">Live API tickets loaded from Supabase PostgreSQL database.</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold text-slate-500 uppercase">Total Tickets</span>
                <span class="text-3xl font-extrabold text-slate-900 block mt-1">${total}</span>
              </div>
              <div class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600"><i class="fa-solid fa-ticket text-lg"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold text-slate-500 uppercase">Open</span>
                <span class="text-3xl font-extrabold text-rose-600 block mt-1">${open}</span>
              </div>
              <div class="w-10 h-10 rounded-lg bg-rose-50 flex items-center justify-center text-rose-600"><i class="fa-solid fa-circle-exclamation text-lg"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold text-slate-500 uppercase">In Progress</span>
                <span class="text-3xl font-extrabold text-blue-600 block mt-1">${inProgress}</span>
              </div>
              <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600"><i class="fa-solid fa-spinner text-lg"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold text-slate-500 uppercase">Resolved</span>
                <span class="text-3xl font-extrabold text-emerald-600 block mt-1">${resolved}</span>
              </div>
              <div class="w-10 h-10 rounded-lg bg-emerald-50 flex items-center justify-center text-emerald-600"><i class="fa-solid fa-circle-check text-lg"></i></div>
            </div>
          </div>

          <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between">
              <h2 class="text-sm font-bold text-slate-900">Database Tickets</h2>
              <button onclick="fetchTickets()" class="text-xs font-semibold text-blue-600 hover:underline"><i class="fa-solid fa-rotate mr-1"></i>Refresh</button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200">
                    <th class="p-3 pl-5">TICKET ID</th>
                    <th class="p-3">TITLE</th>
                    <th class="p-3">CATEGORY</th>
                    <th class="p-3">PRIORITY</th>
                    <th class="p-3">STATUS</th>
                    <th class="p-3 pr-5">ASSIGNEE</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${STATE.tickets.length === 0 ? '<tr><td colspan="6" class="p-6 text-center text-slate-400">No tickets found in database.</td></tr>' : 
                    STATE.tickets.map(t => `
                    <tr class="hover:bg-slate-50/70 transition">
                      <td class="p-3 pl-5 font-bold text-blue-600">${t.ticket_number || t.id}</td>
                      <td class="p-3 font-medium text-slate-900">${t.title}</td>
                      <td class="p-3 text-slate-600"><span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-100">${t.category}</span></td>
                      <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-semibold ${t.priority === 'critical' ? 'bg-rose-50 text-rose-700' : 'bg-amber-50 text-amber-700'} uppercase">${t.priority}</span></td>
                      <td class="p-3"><span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${t.status === 'resolved' ? 'bg-emerald-50 text-emerald-700' : 'bg-sky-50 text-sky-700'}">${t.status}</span></td>
                      <td class="p-3 pr-5 text-slate-500">${t.assignee_name || 'Unassigned'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderQueue() {
      const unassigned = STATE.tickets.filter(t => !t.assignee_name || t.assignee_name === 'Unassigned');
      return `
        <div class="max-w-7xl w-full mx-auto space-y-6">
          <div class="flex justify-between items-center">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">IT Support Ticket Queue</h1>
              <p class="text-xs text-slate-500">Interactive queue status controls and agent assignment.</p>
            </div>
            <span class="px-3 py-1 bg-blue-100 text-blue-700 font-semibold rounded-full text-xs">
              ${unassigned.length} Unassigned
            </span>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-50 text-slate-500 uppercase font-semibold border-b border-slate-200">
                  <th class="p-4">Ticket ID</th>
                  <th class="p-4">Title</th>
                  <th class="p-4">Priority</th>
                  <th class="p-4">Status Control</th>
                  <th class="p-4">Assignee</th>
                  <th class="p-4">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${STATE.tickets.map(t => `
                  <tr class="hover:bg-slate-50 transition">
                    <td class="p-4 font-bold text-blue-600">${t.ticket_number || t.id}</td>
                    <td class="p-4 font-medium">${t.title}</td>
                    <td class="p-4"><span class="${t.priority === 'critical' ? 'text-rose-600' : 'text-amber-600'} font-semibold uppercase">${t.priority}</span></td>
                    <td class="p-4">
                      <select onchange="updateTicketStatus('${t.id}', this.value)" class="bg-slate-50 border border-slate-200 rounded px-2 py-1 font-semibold text-xs">
                        <option value="open" ${t.status === 'open' ? 'selected' : ''}>Open</option>
                        <option value="in_progress" ${t.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                        <option value="resolved" ${t.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                      </select>
                    </td>
                    <td class="p-4 text-slate-600">${t.assignee_name || 'Unassigned'}</td>
                    <td class="p-4">
                      <button onclick="assignTicketToMe('${t.id}')" class="px-3 py-1 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded text-xs font-semibold">
                        Assign to Me
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderCreateTicketModal() {
      return `
        <div id="ticketModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
          <div class="bg-white rounded-2xl w-full max-w-lg border border-slate-200 shadow-xl overflow-hidden p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
              <h3 class="font-bold text-base text-slate-900">Create New Ticket</h3>
              <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleCreateTicket(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Issue Title *</label>
                <input type="text" id="modalTitle" required placeholder="Issue title..." class="w-full px-4 py-2 border rounded-lg text-xs">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Description *</label>
                <textarea id="modalDesc" required placeholder="Description..." class="w-full p-3 border rounded-lg text-xs" rows="3"></textarea>
              </div>
              <div class="flex justify-end gap-2 pt-2 border-t">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded text-xs bg-slate-100">Cancel</button>
                <button type="submit" id="submitBtn" class="px-4 py-2 rounded text-xs bg-blue-600 text-white font-bold">Submit Ticket</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function navigate(view) { STATE.currentView = view; render(); }
    function openModal() { document.getElementById('ticketModal').classList.replace('hidden', 'flex'); }
    function closeModal() { document.getElementById('ticketModal').classList.replace('flex', 'hidden'); }

    async function updateTicketStatus(ticketId, newStatus) {
      try {
        const res = await fetch(`${API_URL}/tickets/${ticketId}`, {
          method: 'PATCH',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${STATE.authToken}`
          },
          body: JSON.stringify({ status: newStatus })
        });
        if (!res.ok) throw new Error('Status update failed');
        fetchTickets();
      } catch (err) { alert('Failed to update ticket status.'); }
    }

    async function assignTicketToMe(ticketId) {
      try {
        const res = await fetch(`${API_URL}/tickets/${ticketId}`, {
          method: 'PATCH',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${STATE.authToken}`
          },
          body: JSON.stringify({ assignee_name: STATE.currentUser.name, status: 'in_progress' })
        });
        if (!res.ok) throw new Error('Assignment failed');
        fetchTickets();
      } catch (err) { alert('Failed to assign ticket.'); }
    }

    async function handleCreateTicket(e) {
      e.preventDefault();
      const title = document.getElementById('modalTitle').value.trim();
      const desc = document.getElementById('modalDesc').value.trim();

      if (!title || !desc) {
        alert('Please fill in both title and description.');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'Saving...';

      try {
        const res = await fetch(`${API_URL}/tickets`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description: desc, category: 'network', priority: 'medium' })
        });
        if (!res.ok) throw new Error('Failed to create ticket');
        closeModal();
        fetchTickets();
      } catch (err) {
        alert('Error creating ticket: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Submit Ticket';
      }
    }

    window.onload = fetchTickets;
  </script>
</body>
</html>
