<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk AI — Enterprise IT Service Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        navy: { 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="h-full text-slate-900 font-sans antialiased overflow-hidden">

    <div id="app" class="h-full flex flex-col"></div>

    <script>
        // Configurable API Endpoint Resolution (Local vs Production Deployed)
        const API_URL = window.ENV_API_URL || 
                        (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                         ? 'http://127.0.0.1:8000/api' 
                         : 'https://it-helpdesk-backend.onrender.com/api');

        const STATE = {
            currentView: 'dashboard',
            currentRole: 'employee',
            currentUser: { name: 'Pocharam Jayanth', email: 'jayanth@enterprise.internal', avatar: 'PJ' },
            tickets: [],
            isLoading: false,
            errorMessage: null
        };

        async function fetchTickets() {
            STATE.isLoading = true;
            STATE.errorMessage = null;
            render();
            try {
                const res = await fetch(`${API_URL}/tickets`);
                if (!res.ok) throw new Error(`HTTP error ${res.status}`);
                STATE.tickets = await res.json();
            } catch (err) {
                console.error('API Error:', err);
                STATE.errorMessage = 'Failed to connect to FastAPI server at ' + API_URL;
            } finally {
                STATE.isLoading = false;
                render();
            }
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="h-full bg-slate-50 flex text-slate-900 overflow-hidden">
                    ${renderSidebar()}
                    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
                        ${renderTopbar()}
                        <main class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                            ${STATE.errorMessage ? `
                                <div class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center justify-between">
                                    <span><i class="fa-solid fa-triangle-exclamation mr-2"></i>${STATE.errorMessage}</span>
                                    <button onclick="fetchTickets()" class="px-3 py-1 bg-red-600 text-white rounded-lg text-xs font-semibold">Retry</button>
                                </div>
                            ` : ''}
                            ${renderMainContent()}
                        </main>
                    </div>
                </div>
                ${renderCreateTicketModal()}
            `;
        }

        function renderSidebar() {
            return `
                <aside class="w-64 bg-navy-900 text-slate-300 flex-shrink-0 flex flex-col justify-between border-r border-slate-800">
                    <div>
                        <div class="p-6 border-b border-slate-800/80 flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-blue-500/30">H</div>
                            <div>
                                <span class="font-bold text-white text-base tracking-tight">HelpDesk <span class="text-blue-500">AI</span></span>
                                <span class="block text-[11px] text-slate-400">Enterprise IT Hub</span>
                            </div>
                        </div>
                        <nav class="p-4 space-y-1 text-sm font-medium">
                            <a href="javascript:void(0)" onclick="navigate('dashboard')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg ${STATE.currentView === 'dashboard' ? 'text-white bg-blue-600 font-semibold' : 'hover:bg-slate-800 hover:text-white'}"><i class="fa-solid fa-chart-pie w-5"></i> Overview</a>
                            <a href="javascript:void(0)" onclick="navigate('queue')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg ${STATE.currentView === 'queue' ? 'text-white bg-blue-600 font-semibold' : 'hover:bg-slate-800 hover:text-white'}"><i class="fa-solid fa-list-check w-5"></i> IT Ticket Queue</a>
                            <a href="javascript:void(0)" onclick="openModal()" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-circle-plus w-5"></i> Create Ticket</a>
                        </nav>
                    </div>
                    <div class="p-4 border-t border-slate-800 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs">${STATE.currentUser.avatar}</div>
                            <div>
                                <span class="block text-xs font-semibold text-white">${STATE.currentUser.name}</span>
                                <span class="block text-[11px] text-slate-400 capitalize">${STATE.currentRole}</span>
                            </div>
                        </div>
                    </div>
                </aside>
            `;
        }

        function renderTopbar() {
            return `
                <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between sticky top-0 z-20">
                    <div class="relative w-96">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                        <input type="text" placeholder="Search tickets or keywords..." class="w-full pl-9 pr-4 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div class="flex items-center gap-4">
                        <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-medium flex items-center gap-2 shadow-sm transition">
                            <i class="fa-solid fa-plus"></i> New Ticket
                        </button>
                    </div>
                </header>
            `;
        }

        function renderMainContent() {
            if (STATE.isLoading) {
                return `<div class="p-12 text-center text-slate-500 font-medium"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p>Loading database tickets...</p></div>`;
            }
            return STATE.currentView === 'queue' ? renderQueue() : renderDashboard();
        }

        function renderDashboard() {
            const total = STATE.tickets.length;
            const open = STATE.tickets.filter(t => t.status === 'open').length;
            const inProgress = STATE.tickets.filter(t => t.status === 'in_progress').length;
            const resolved = STATE.tickets.filter(t => t.status === 'resolved').length;

            return `
                <div class="space-y-6">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900">Good morning, ${STATE.currentUser.name}</h1>
                        <p class="text-sm text-slate-500">Connected to Supabase PostgreSQL via FastAPI microservice.</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-xs text-slate-500 font-semibold uppercase">Total Tickets</p>
                            <h3 class="text-2xl font-bold mt-1">${total}</h3>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-xs text-slate-500 font-semibold uppercase">Open</p>
                            <h3 class="text-2xl font-bold mt-1">${open}</h3>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-xs text-slate-500 font-semibold uppercase">In Progress</p>
                            <h3 class="text-2xl font-bold mt-1">${inProgress}</h3>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-xs text-slate-500 font-semibold uppercase">Resolved</p>
                            <h3 class="text-2xl font-bold mt-1">${resolved}</h3>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                            <h3 class="font-bold text-base">Database Tickets</h3>
                            <button onclick="fetchTickets()" class="text-xs text-blue-600 hover:underline font-semibold"><i class="fa-solid fa-rotate mr-1"></i>Refresh</button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-400 text-xs uppercase font-semibold">
                                        <th class="px-6 py-3">Ticket ID</th>
                                        <th class="px-6 py-3">Title</th>
                                        <th class="px-6 py-3">Category</th>
                                        <th class="px-6 py-3">Priority</th>
                                        <th class="px-6 py-3">Status</th>
                                        <th class="px-6 py-3">Assignee</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200 text-sm">
                                    ${STATE.tickets.length === 0 ? '<tr><td colspan="6" class="px-6 py-6 text-center text-slate-400">No tickets found in Supabase database.</td></tr>' : 
                                        STATE.tickets.map(t => `
                                        <tr class="hover:bg-slate-50 transition">
                                            <td class="px-6 py-4 font-semibold text-blue-600">${t.ticket_number || t.id}</td>
                                            <td class="px-6 py-4 font-medium">${t.title}</td>
                                            <td class="px-6 py-4"><span class="px-2 py-0.5 rounded text-xs font-semibold bg-slate-100">${t.category}</span></td>
                                            <td class="px-6 py-4"><span class="${t.priority === 'critical' ? 'text-red-600' : 'text-amber-600'} font-semibold uppercase text-xs">${t.priority}</span></td>
                                            <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${t.status === 'resolved' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${t.status}</span></td>
                                            <td class="px-6 py-4 text-slate-600">${t.assignee_name || 'Unassigned'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQueue() {
            const unassigned = STATE.tickets.filter(t => !t.assignee_name || t.assignee_name === 'Unassigned');
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-900">IT Support Ticket Queue</h1>
                            <p class="text-sm text-slate-500">Manage agent assignments, SLAs, and status transitions.</p>
                        </div>
                        <span class="px-3 py-1 bg-blue-100 text-blue-700 font-semibold rounded-full text-xs">
                            ${unassigned.length} Unassigned Tickets
                        </span>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-400 text-xs uppercase font-semibold">
                                        <th class="px-6 py-3">Ticket ID</th>
                                        <th class="px-6 py-3">Title</th>
                                        <th class="px-6 py-3">Priority</th>
                                        <th class="px-6 py-3">Status Control</th>
                                        <th class="px-6 py-3">Assignee</th>
                                        <th class="px-6 py-3">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200 text-sm">
                                    ${STATE.tickets.map(t => `
                                        <tr class="hover:bg-slate-50 transition">
                                            <td class="px-6 py-4 font-semibold text-blue-600">${t.ticket_number || t.id}</td>
                                            <td class="px-6 py-4 font-medium">${t.title}</td>
                                            <td class="px-6 py-4"><span class="${t.priority === 'critical' ? 'text-red-600' : 'text-amber-600'} font-semibold text-xs uppercase">${t.priority}</span></td>
                                            <td class="px-6 py-4">
                                                <select onchange="updateTicketStatus('${t.id}', this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded px-2 py-1 font-semibold">
                                                    <option value="open" ${t.status === 'open' ? 'selected' : ''}>Open</option>
                                                    <option value="in_progress" ${t.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                                                    <option value="resolved" ${t.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                                                </select>
                                            </td>
                                            <td class="px-6 py-4 text-slate-600">${t.assignee_name || 'Unassigned'}</td>
                                            <td class="px-6 py-4">
                                                <button onclick="assignTicketToMe('${t.id}')" class="px-3 py-1 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded text-xs font-semibold">
                                                    Assign to Me
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCreateTicketModal() {
            return `
                <div id="ticketModal" class="fixed inset-0 bg-navy-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-2xl w-full max-w-lg border border-slate-200 shadow-xl overflow-hidden">
                        <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                            <h3 class="font-bold text-lg text-slate-900">Create New Ticket</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onsubmit="handleCreateTicket(event)" class="p-6 space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Issue Title</label>
                                <input type="text" id="modalTitle" required placeholder="e.g. Cannot connect to internal VPN" class="w-full px-4 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Category</label>
                                    <select id="modalCategory" class="w-full px-4 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm">
                                        <option value="network">Network</option>
                                        <option value="hardware">Hardware</option>
                                        <option value="software">Software</option>
                                        <option value="account_access">Account Access</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Priority</label>
                                    <select id="modalPriority" class="w-full px-4 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm">
                                        <option value="low">Low</option>
                                        <option value="medium" selected>Medium</option>
                                        <option value="high">High</option>
                                        <option value="critical">Critical</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Description</label>
                                <textarea id="modalDesc" rows="3" required placeholder="Describe symptoms..." class="w-full px-4 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
                            </div>
                            <div class="flex justify-between items-center pt-2">
                                <button type="button" onclick="runAITriage()" class="px-3 py-2 rounded-lg text-xs font-semibold bg-blue-50 text-blue-600 hover:bg-blue-100 flex items-center gap-1.5"><i class="fa-solid fa-wand-magic-sparkles"></i> ⚡ Run AI Triage</button>
                                <div class="flex space-x-2">
                                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm bg-slate-100 text-slate-700">Cancel</button>
                                    <button type="submit" id="submitBtn" class="px-4 py-2 rounded-lg text-sm bg-blue-600 hover:bg-blue-700 text-white font-medium">Submit Ticket</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function navigate(view) { STATE.currentView = view; render(); }
        function openModal() { document.getElementById('ticketModal').classList.replace('hidden', 'flex'); }
        function closeModal() { document.getElementById('ticketModal').classList.replace('flex', 'hidden'); }

        async function updateTicketStatus(ticketId, newStatus) {
            try {
                const res = await fetch(`${API_URL}/tickets/${ticketId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                if (res.ok) fetchTickets();
            } catch (err) {
                alert('Failed to update ticket status.');
            }
        }

        async function assignTicketToMe(ticketId) {
            try {
                const res = await fetch(`${API_URL}/tickets/${ticketId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ assignee_name: STATE.currentUser.name, status: 'in_progress' })
                });
                if (res.ok) fetchTickets();
            } catch (err) {
                alert('Failed to assign ticket.');
            }
        }

        async function runAITriage() {
            const title = document.getElementById('modalTitle').value;
            const desc = document.getElementById('modalDesc').value;
            if (!title && !desc) return alert('Enter title and description first.');

            try {
                const res = await fetch(`${API_URL}/triage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description: desc })
                });
                const data = await res.json();
                if (data.suggested_category) document.getElementById('modalCategory').value = data.suggested_category;
                if (data.suggested_priority) document.getElementById('modalPriority').value = data.suggested_priority;
                alert(`⚡ AI Triage Recommendation:\n\nCategory: ${data.suggested_category.toUpperCase()}\nPriority: ${data.suggested_priority.toUpperCase()}\nConfidence: ${(data.confidence_score * 100).toFixed(0)}%\n\nReasoning: ${data.reasoning}`);
            } catch (err) {
                alert('Could not reach AI Triage endpoint on ' + API_URL);
            }
        }

        async function handleCreateTicket(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Saving...';

            const category = document.getElementById('modalCategory').value;
            const priority = document.getElementById('modalPriority').value;

            const payload = {
                title: document.getElementById('modalTitle').value,
                description: document.getElementById('modalDesc').value,
                category: category,
                priority: priority
            };

            try {
                const res = await fetch(`${API_URL}/tickets`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('Failed to create ticket');
                closeModal();
                fetchTickets();
            } catch (err) {
                alert('Failed to insert ticket into database.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Submit Ticket';
            }
        }

        window.onload = fetchTickets;
    </script>
</body>
</html>
