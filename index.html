<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 hidden md:flex flex-col justify-between">
        <div>
            <div class="h-16 flex items-center px-6 border-b border-slate-200 dark:border-slate-700">
                <i class="fa-solid fa-headset text-brand-500 text-2xl mr-3"></i>
                <span class="font-bold text-lg tracking-tight">HelpDesk</span>
            </div>
            <nav class="p-4 space-y-1">
                <a href="#" class="flex items-center px-4 py-3 rounded-xl bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 font-medium">
                    <i class="fa-solid fa-chart-pie w-6"></i> Dashboard
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-200 dark:border-slate-700">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-brand-500 text-white flex items-center justify-center font-bold">PJ</div>
                <div>
                    <p class="text-sm font-medium">Pocharam Jayanth</p>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Administrator</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0">
        <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 flex items-center justify-between">
            <div class="flex items-center space-x-4 w-1/3">
                <div class="relative w-full max-w-md">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Search tickets..." class="w-full pl-10 pr-4 py-2 bg-slate-100 dark:bg-slate-700/50 border border-transparent dark:border-slate-600 rounded-lg text-sm focus:outline-none focus:bg-white dark:focus:bg-slate-800 focus:border-brand-500 transition">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="openModal()" class="bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-2 shadow-sm transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>New Ticket</span>
                </button>
            </div>
        </header>

        <main class="flex-1 p-6 overflow-y-auto space-y-6">
            <!-- Dynamic Stats Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <p class="text-sm text-slate-500 dark:text-slate-400 font-medium">Total Tickets</p>
                    <h3 id="statTotal" class="text-2xl font-bold mt-1">0</h3>
                </div>
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <p class="text-sm text-slate-500 dark:text-slate-400 font-medium">Open Tickets</p>
                    <h3 id="statOpen" class="text-2xl font-bold mt-1">0</h3>
                </div>
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <p class="text-sm text-slate-500 dark:text-slate-400 font-medium">Resolved</p>
                    <h3 id="statResolved" class="text-2xl font-bold mt-1">0</h3>
                </div>
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <p class="text-sm text-slate-500 dark:text-slate-400 font-medium">Active High/Critical</p>
                    <h3 id="statHigh" class="text-2xl font-bold mt-1">0</h3>
                </div>
            </div>

            <!-- Live Table -->
            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                    <h3 class="font-bold text-base">Live Support Tickets</h3>
                    <button onclick="loadTickets()" class="text-sm text-brand-500 hover:underline font-medium flex items-center space-x-1">
                        <i class="fa-solid fa-rotate-right"></i> <span>Refresh</span>
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 dark:bg-slate-700/50 text-slate-400 text-xs uppercase tracking-wider font-semibold">
                                <th class="px-6 py-3">Ticket ID</th>
                                <th class="px-6 py-3">Title</th>
                                <th class="px-6 py-3">Category</th>
                                <th class="px-6 py-3">Status</th>
                                <th class="px-6 py-3">Priority</th>
                                <th class="px-6 py-3">Requester</th>
                            </tr>
                        </thead>
                        <tbody id="ticketTableBody" class="divide-y divide-slate-200 dark:divide-slate-700 text-sm">
                            <tr><td colspan="6" class="px-6 py-4 text-center text-slate-400">Loading tickets from FastAPI server...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="ticketModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-lg border border-slate-200 dark:border-slate-700 shadow-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-lg">Create New Ticket</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="ticketForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Issue Title</label>
                    <input type="text" id="ticketTitle" required placeholder="e.g. Cannot connect to internal runner" class="w-full px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Description</label>
                    <textarea id="ticketDesc" rows="3" required placeholder="Detailed information..." class="w-full px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-sm"></textarea>
                </div>
                <div class="flex justify-between items-center pt-2">
                    <button type="button" onclick="triggerAITriage()" class="px-3 py-2 rounded-lg text-xs font-semibold bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition">
                        ⚡ Run AI Triage
                    </button>
                    <div class="space-x-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm bg-slate-100 dark:bg-slate-700">Cancel</button>
                        <button type="submit" class="px-4 py-2 rounded-lg text-sm bg-brand-500 text-white font-medium">Submit Ticket</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api';

        async function loadTickets() {
            try {
                const res = await fetch(`${API_URL}/tickets`);
                const tickets = await res.json();
                renderTable(tickets);
                updateStats(tickets);
            } catch (err) {
                console.error('API Fetch Error:', err);
            }
        }

        function renderTable(tickets) {
            const tbody = document.getElementById('ticketTableBody');
            tbody.innerHTML = tickets.map(t => `
                <tr>
                    <td class="px-6 py-4 font-medium">${t.ticket_number || '#TCK-LOCAL'}</td>
                    <td class="px-6 py-4 font-medium">${t.title}</td>
                    <td class="px-6 py-4"><span class="px-2 py-0.5 rounded text-xs font-semibold bg-slate-100 dark:bg-slate-700">${t.category}</span></td>
                    <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-700">${t.status}</span></td>
                    <td class="px-6 py-4"><span class="text-red-500 font-medium"><i class="fa-solid fa-circle text-xs mr-1"></i>${t.priority}</span></td>
                    <td class="px-6 py-4 text-slate-500">${t.requester_name || 'Jayanth'}</td>
                </tr>
            `).join('');
        }

        function updateStats(tickets) {
            document.getElementById('statTotal').innerText = tickets.length;
            document.getElementById('statOpen').innerText = tickets.filter(t => t.status === 'open').length;
            document.getElementById('statResolved').innerText = tickets.filter(t => t.status === 'resolved').length;
            document.getElementById('statHigh').innerText = tickets.filter(t => t.priority === 'high' || t.priority === 'critical').length;
        }

        async function triggerAITriage() {
            const title = document.getElementById('ticketTitle').value;
            const description = document.getElementById('ticketDesc').value;
            if(!title && !description) return alert('Provide title/description first');

            const res = await fetch(`${API_URL}/triage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description })
            });
            const data = await res.json();
            alert(`AI Suggestion:\nCategory: ${data.suggested_category}\nPriority: ${data.suggested_priority}\nConfidence: ${data.confidence_score * 100}%`);
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('ticketTitle').value;
            const description = document.getElementById('ticketDesc').value;

            await fetch(`${API_URL}/tickets`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description })
            });

            closeModal();
            document.getElementById('ticketForm').reset();
            loadTickets();
        }

        function openModal() { document.getElementById('ticketModal').classList.replace('hidden', 'flex'); }
        function closeModal() { document.getElementById('ticketModal').classList.replace('flex', 'hidden'); }

        window.onload = loadTickets;
    </script>
</body>
</html>
